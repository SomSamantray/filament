name: "CI: Test"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event.pull_request.user.login != 'gx-null[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: cmd/go.sum

      - name: Build
        env:
          GOWORK: off
          CGO_ENABLED: "0"
          GOOS: linux
        run: cd cmd && go build ./...

      - name: Build worker
        env:
          GOWORK: off
          CGO_ENABLED: "1"
          GOOS: linux
        run: go build -C cmd/worker -o /dev/null .

  unit:
    if: github.event.pull_request.user.login != 'gx-null[bot]'
    runs-on: ubuntu-latest
    env:
      FILAMENT_TEST_POSTGRES_DSN: postgres://postgres:filament-test@127.0.0.1:5432/postgres?sslmode=disable
      FILAMENT_TEST_MYSQL_DSN: mysql://root:filament-test@127.0.0.1:3306/
    services:
      postgres:
        image: docker.io/library/postgres:16.15
        env:
          POSTGRES_PASSWORD: filament-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: docker.io/library/mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: filament-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfilament-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Allow LOAD DATA on the MySQL service
        run: |
          id=$(docker ps --format '{{.ID}} {{.Image}}' | awk '/mysql/ {print $1; exit}')
          docker exec -e MYSQL_PWD=filament-test "$id" mysql -uroot -e "SET GLOBAL local_infile = ON"

      - name: Test
        run: just test

  integration:
    name: Integration (${{ matrix.engine }})
    if: github.event.pull_request.user.login != 'gx-null[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      CONTAINER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Start Podman
        if: matrix.engine == 'podman'
        uses: redhat-actions/podman-install@4a134a65f7324b2d03498c672cd4c6bce93e94b5 # v1
        with:
          start-service: "true"

      - name: Check Podman
        if: matrix.engine == 'podman'
        run: just container-check

      - name: Integration test
        run: just test-integration

  e2e:
    name: E2E (${{ matrix.engine }})
    if: github.event.pull_request.user.login != 'gx-null[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: docker
            tags: e2e,privileged
          # Rootless Podman cannot run the privileged nested k3s container.
          - engine: podman
            tags: e2e
    env:
      CONTAINER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Start Podman
        if: matrix.engine == 'podman'
        uses: redhat-actions/podman-install@4a134a65f7324b2d03498c672cd4c6bce93e94b5 # v1
        with:
          start-service: "true"

      - name: Check Podman
        if: matrix.engine == 'podman'
        run: just container-check

      - name: Install duckdb
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          unzip -d /usr/local/bin /tmp/duckdb.zip duckdb

      - name: End-to-end test
        run: just test-e2e "${{ matrix.tags }}"

  test-ok:
    needs: [build, unit, integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
